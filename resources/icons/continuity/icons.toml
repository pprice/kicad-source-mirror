# Continuity's icons for KiCad's PCB editor: each BITMAPS name and the SVG
# drawn in its place. Paths are relative to this folder. lucide/ is Lucide
# v0.469.0 (ISC, see lucide/LICENSE), files unchanged; ours/ is drawn on
# Lucide's grid in its style. Every file strokes and fills in currentColor,
# which the loader replaces with the ink colour.
#
# One line per icon: kicad_name = "lucide/file.svg" or "ours/file.svg".

